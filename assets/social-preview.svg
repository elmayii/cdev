    <circle cx="590" cy="470" r="26"/>
  </g>
  <g stroke="#94a3b8" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 286 470 l 10 10 l 18 -20"/>
    <path d="M 576 470 l 10 10 l 18 -20"/>
  </g>
  <circle cx="880" cy="470" r="26" fill="#818cf8"/>
  <circle cx="880" cy="470" r="40" fill="none" stroke="#818cf8" stroke-width="6" opacity="0.4"/>
